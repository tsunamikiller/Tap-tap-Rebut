<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rhythm Tap</title>
<style>
:root{color-scheme:dark;--bg:#2a0a60;--fg:#f1f4ff;--mut:#8fa3c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#menu,#po{position:fixed;inset:0;overflow:auto;display:flex;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 28px;box-sizing:border-box;touch-action:pan-y}
#po{align-items:center;text-align:center;background:rgba(20,4,60,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.box{max-width:460px;width:100%}
h1{margin:6px 0 10px;font-size:34px;letter-spacing:1px;text-align:center;color:#fff;text-shadow:0 0 18px rgba(255,90,230,.8),0 0 4px #fff}
h3{margin:2px 0 10px;font-size:12px;letter-spacing:3px;color:var(--mut);font-weight:600}
.m{color:var(--mut)}
.card,.pn{background:linear-gradient(180deg,rgba(10,28,52,.95),rgba(5,14,30,.96));border:1px solid rgba(130,170,255,.16);border-radius:22px;padding:14px;margin:14px 0;line-height:1.6;box-shadow:0 12px 36px rgba(0,0,0,.4),0 0 24px rgba(160,90,255,.18)}
.pn{padding:0;overflow:hidden}
#hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#04070e;letter-spacing:3px;font-size:14px;color:#cfd8ff}
.hr{display:flex;align-items:center;gap:6px;letter-spacing:0;font-size:13px}.hr b{margin-right:8px;font-weight:600}.sb{color:#ffc933;font-size:20px}
#list{max-height:42vh;overflow:auto;touch-action:pan-y}
.song{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer;transition:background .2s}
.song.sel{background:rgba(80,140,255,.2);box-shadow:inset 0 0 0 1px rgba(130,190,255,.55)}
.cv{width:56px;height:56px;border-radius:7px;background:linear-gradient(135deg,#ff4fd8,#4a0f9e) center/cover;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt small{color:var(--mut)}
.stz i{font-style:normal;color:#1c2a3e;font-size:15px}.stz i.on{color:#ffc933;text-shadow:0 0 6px rgba(255,200,50,.6)}
.md{display:inline-block;width:30px;height:30px;border-radius:50%;flex:none;background:#050a12;box-shadow:inset 0 0 0 1px #0f1b2c}
.m1{background:radial-gradient(circle at 35% 30%,#fff,#aab8d4);box-shadow:0 0 8px rgba(200,220,255,.5)}
.m2{background:radial-gradient(circle at 35% 30%,#d58aff,#5a1bb0);box-shadow:0 0 10px rgba(180,90,255,.7)}
.m3{background:radial-gradient(circle at 35% 30%,#fff1a0,#e09a00);box-shadow:0 0 10px rgba(255,200,60,.7)}
.hr .md{width:22px;height:22px}
.empty{padding:22px;text-align:center;color:var(--mut)}
.btn{display:block;box-sizing:border-box;width:100%;text-align:center;padding:14px;margin:10px 0;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:linear-gradient(180deg,rgba(130,90,230,.5),rgba(50,24,110,.7));color:var(--fg);font:600 16px system-ui,sans-serif;box-shadow:0 0 18px rgba(150,90,255,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.go{background:linear-gradient(90deg,#ffd23d,#ff4fb0);color:#2a0640;border:0;box-shadow:0 0 28px rgba(255,79,176,.65)}
.btn:disabled{opacity:.4;box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}
#kb,.two{display:flex;gap:8px}.k{flex:1;margin:0;padding:10px}
select,input[type=range]{background:rgba(4,10,24,.8);color:var(--fg);border:1px solid rgba(130,170,255,.2);border-radius:10px;padding:6px;max-width:55%;accent-color:#ff4fb0}
#pb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,4,40,.55);color:#fff;font-size:18px;box-shadow:0 0 16px rgba(255,79,216,.45)}
</style></head><body>
<canvas id="cv"></canvas>
<button id="pb" hidden>II</button>
<div id="menu"><div class="box">
<h1>Rhythm Tap</h1>
<div class="pn"><div id="hdr"></div><div id="list"></div></div>
<label class="btn" for="fi">＋ Добавить музыку</label><input id="fi" type="file" accept="audio/*" multiple hidden>
<button id="dm" class="btn">Демо-трек (128 BPM)</button>
<div id="info" class="card m">Добавьте трек: игра найдёт BPM, сильные доли и структуру песни.</div>
<div class="two" id="tp" hidden><button id="hf" class="btn k">½ темпа</button><button id="dbl" class="btn k">×2 темпа</button></div>
<button id="go" class="btn go" disabled>Играть</button>
<div class="card"><h3>ИГРА</h3>
<div class="row">Стиль<select id="st"><option value="star">Звёзды (BeatStar)</option><option value="auto">Авто (по музыке)</option><option value="neon">Неон</option><option value="sunset">Закат</option><option value="matrix">Матрица</option><option value="ocean">Океан</option></select></div>
<div class="row">Сложность<select id="df"><option value="easy">Лёгкая</option><option value="normal">Нормальная</option><option value="hard">Экстрим</option></select></div>
<div class="row">Дорожек<select id="ln"><option value="3">3 (как BeatStar)</option><option value="4">4</option></select></div>
<div class="row">Скорость <span id="spv"></span><input id="sp" type="range" min="1" max="10"></div>
<div class="row">Сдвиг звука <span id="ofv"></span><input id="of" type="range" min="-200" max="200" step="5"></div>
</div>
<div class="card"><h3>ЗВУК НАЖАТИЯ</h3>
<div class="row">Звук<select id="sn"><option value="click">Щелчок</option><option value="shot">Выстрел</option><option value="pop">Поп</option><option value="snap">Снэп</option><option value="chime">Кристалл</option><option value="tom">Том</option><option value="off">Выкл</option></select></div>
<div class="row">Громкость <span id="vlv"></span><input id="vl" type="range" min="0" max="100"></div>
</div>
<div class="card"><h3>УПРАВЛЕНИЕ</h3>
<div class="row">Ввод<select id="in"><option value="both">Клавиши + мышь/касание</option><option value="keys">Только клавиши</option><option value="mouse">Только мышь/касание</option></select></div>
<div class="m" style="margin:4px 0">Нажмите кнопку дорожки, затем новую клавишу. Длинные ноты удерживайте:</div>
<div id="kb"></div>
</div>
<p class="m" style="text-align:center">Пауза: Esc или кнопка II. Лучше играть в наушниках.</p>
</div></div>
<div id="po" hidden><div class="box"><h1 id="pt"></h1><p id="ps" class="m"></p><button id="b1" class="btn go"></button><button id="b2" class="btn"></button></div></div>
<script>

const $=i=>document.getElementById(i);
const ST={
star:{n:'Звёзды',bg:['#c21fe0','#4a0f9e'],ln:['#ff4fd8','#d95bff','#7a5cff','#ffd23d'],fl:['#f3eeff','#cfc4ee'],gw:'#d95bff'},
neon:{n:'Неон',bg:['#2a0070','#6a10c0'],ln:['#ff2bd6','#2bd6ff','#ffe92b','#7bff2b'],fl:['#e9e2ff','#c0b2f0'],gw:'#2bd6ff'},
sunset:{n:'Закат',bg:['#ff6a3d','#8a1a4a'],ln:['#ff5e5e','#ff9e3d','#ffd23d','#ff7ac8'],fl:['#fff1e8','#ffd0b8'],gw:'#ff5a2a'},
matrix:{n:'Матрица',bg:['#00a040','#012a14'],ln:['#00ff66','#7dff9a','#00d4a0','#b6ff3d'],fl:['#e8fff0','#b8ecd0'],gw:'#00d060'},
ocean:{n:'Океан',bg:['#1090d8','#06285a'],ln:['#3dc8ff','#7d9bff','#3dffd9','#c0e8ff'],fl:['#e8f5ff','#b8dcf8'],gw:'#2a9dff'}};
let cfg={style:'star',diff:'normal',speed:5,off:0,lanes:3,input:'both',snd:'click',vol:40,keys:['KeyD','KeyF','KeyJ','KeyK']};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('rt3')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('rt3',JSON.stringify(cfg))}catch(_){}};
const SUF={off:' мс',vol:'%'};
const bind=(id,k,num)=>{const e=$(id),o=$(id+'v');const f=()=>{cfg[k]=num?+e.value:e.value;if(o)o.textContent=e.value+(SUF[k]||'');sv()};e.value=cfg[k];e.addEventListener('input',f);e.addEventListener('change',f);f()};
bind('st','style');bind('df','diff');bind('ln','lanes',1);bind('sp','speed',1);bind('of','off',1);bind('sn','snd');bind('vl','vol',1);bind('in','input');
let rb=-1;const kn=c=>c.replace(/^(Key|Digit|Numpad)/,'').replace('Arrow','');
function drawKeys(){const k=$('kb');k.innerHTML='';for(let i=0;i<cfg.lanes;i++){const b=document.createElement('button');b.className='btn k';b.textContent=rb===i?'…':kn(cfg.keys[i]);b.onclick=()=>{rb=i;drawKeys()};k.appendChild(b)}}
$('ln').addEventListener('change',drawKeys);drawKeys();
$('sn').addEventListener('change',()=>hs(cfg.snd,1));$('vl').addEventListener('change',()=>hs(cfg.snd,1));

let actx,buf,A=null,nm='';
const ac=()=>actx||(actx=new(window.AudioContext||window.webkitAudioContext)());
/* ---------- Звуки нажатия ---------- */
let nb;const noise=()=>nb||(()=>{const c=ac(),b=c.createBuffer(1,c.sampleRate>>1,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return nb=b})();
function hs(kind,l){const v=cfg.vol/100*.5;if(kind==='off'||v<.005)return;const c=ac(),t=c.currentTime,k=1+.1*l;
 const osc=(type,f0,f1,dur,a)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0*k,t);o.frequency.exponentialRampToValueAtTime(f1*k,t+dur);g.gain.setValueAtTime(a*v,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)};
 const nz=(ft,f,q,dur,a)=>{const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=noise();fl.type=ft;fl.frequency.setValueAtTime(f*k,t);fl.Q.value=q;g.gain.setValueAtTime(a*v,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(t);s.stop(t+dur+.02)};
 if(kind==='click')nz('highpass',3500,1,.03,1.2);
 else if(kind==='shot'){nz('lowpass',4000,1,.14,1.6);osc('sine',180,45,.12,1.2)}
 else if(kind==='pop')osc('sine',700,150,.09,1.3);
 else if(kind==='snap'){nz('bandpass',2200,3,.06,1.8);osc('triangle',1200,600,.04,.5)}
 else if(kind==='chime'){osc('sine',1568,1568,.35,.9);osc('triangle',2349,2349,.25,.35)}
 else if(kind==='tom')osc('sine',220,90,.16,1.4)}

/* ---------- Анализ: BPM, доли, размер, энергия, сустейн ---------- */
function analyze(b){
 const sr=b.sampleRate,n=b.length,H=256,F=Math.floor(n/H),fr=sr/H,ch=b.numberOfChannels;
 const x=new Float32Array(n);
 for(let c=0;c<ch;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)x[i]+=d[i]/ch}
 const E=[0,1,2].map(()=>new Float32Array(F));
 const a1=1-Math.exp(-2*Math.PI*150/sr),a2=1-Math.exp(-2*Math.PI*2500/sr);let l1=0,l2=0;
 for(let f=0;f<F;f++){let s0=0,s1=0,s2=0;
  for(let i=f*H,e=i+H;i<e;i++){const v=x[i];l1+=a1*(v-l1);l2+=a2*(v-l2);const m=l2-l1,h=v-l2;s0+=l1*l1;s1+=m*m;s2+=h*h}
  E[0][f]=Math.sqrt(s0/H);E[1][f]=Math.sqrt(s1/H);E[2][f]=Math.sqrt(s2/H)}
 const fl=E.map(e=>{const o=new Float32Array(F);let p1=0,p2=0,sum=0;
  for(let f=0;f<F;f++){const c=Math.log(1+2000*e[f]);o[f]=Math.max(0,c-Math.max(p1,p2));p2=p1;p1=c;sum+=o[f]}
  const m=sum/F||1;for(let f=0;f<F;f++)o[f]/=m;return o});
 const tot=new Float32Array(F);for(let f=0;f<F;f++)tot[f]=1.2*fl[0][f]+fl[1][f]+.8*fl[2][f];
 // энергия (структура: интро/куплет/припев) и сглаженная средняя полоса (вокал/лид для длинных нот)
 const smooth=(src,R)=>{const p=new Float64Array(F+1);for(let i=0;i<F;i++)p[i+1]=p[i]+src[i];const o=new Float32Array(F),g=p[F]/F||1;for(let f=0;f<F;f++){const a=Math.max(0,f-R),c=Math.min(F,f+R);o[f]=(p[c]-p[a])/(c-a)/g}return[o,g]};
 const en=new Float32Array(F);for(let f=0;f<F;f++)en[f]=E[0][f]+E[1][f]+E[2][f];
 const es=smooth(en,Math.round(2*fr))[0],[m1,gm1]=smooth(E[1],4);
 const comb=bpm=>{const P=60*fr/bpm;let best=-1;
  for(let ph=0;ph<P;ph+=1){let s=0,k=0;for(let t=ph;t<F-P;t+=P,k++){const i=t|0,w=t-i;s+=tot[i]*(1-w)+tot[i+1]*w;const h=t+P/2,j=h|0;s+=.5*(tot[j]*(1-(h-j))+tot[j+1]*(h-j))}
   s/=k||1;if(s>best)best=s}return best};
 const prior=bpm=>Math.exp(-.5*Math.pow(Math.log2(bpm/120)/.8,2));
 let bB=0,bs=-1;for(let bpm=70;bpm<=190;bpm+=.5){const s=comb(bpm)*prior(bpm);if(s>bs){bs=s;bB=bpm}}
 const refine=c=>{let fb=c,fv=-1;for(let bpm=c-1.2;bpm<=c+1.2;bpm+=.02){const s=comb(bpm);if(s>fv){fv=s;fb=bpm}}return[fb,fv]};
 // кандидаты: основной темп и кратные/полиритмические варианты; выбираем по энергии ударов на сетке долей
 let fB=bB,fs=-1;
 for(const r of[1,2,.5,1.5,2/3,4/3,.75]){const c=bB*r;if(c<65||c>200)continue;const[fb,fv]=refine(c);const sc=fv*(.55+.45*prior(fb));
  // кратные варианты (×2, ×½) почти равны по энергии, поэтому требуем явного преимущества над основным
  const need=r===1?1:(r===2||r===.5)?1.25:1.06;
  if(fs<0||sc>fs*need){fs=sc;fB=fb}}
 const sum=e=>e.reduce((a,v)=>a+v,0),s0=sum(E[0]),s1=sum(E[1])||1,s2=sum(E[2]);
 const a={fl,tot,es,m1,gm1,fr,H,dur:n/sr,bpm:Math.round(fB*10)/10,bass:s0/s1,hi:s2/s1};
 return Object.assign(a,track(a,a.bpm));
}
/* трекинг долей (динамическое программирование) + размер 4/4 или 3/4 + позиция сильной доли */
function track(a,bpm){
 const{tot,fl,fr}=a,F=tot.length,P=60*fr/bpm;
 let m=0,v=0;for(let f=0;f<F;f++)m+=tot[f];m/=F;for(let f=0;f<F;f++)v+=(tot[f]-m)**2;const sd=Math.sqrt(v/F)||1;
 const cs=new Float32Array(F),bk=new Int32Array(F).fill(-1),lo=Math.round(P/2),hi=Math.round(2*P);
 for(let t=0;t<F;t++){let best=0,bi=-1;
  for(let d=lo;d<=hi&&t-d>=0;d++){const s=cs[t-d]-80*Math.log(d/P)**2;if(s>best){best=s;bi=t-d}}
  cs[t]=tot[t]/sd+best;bk[t]=bi}
 let e=Math.max(0,F-hi);for(let t=e;t<F;t++)if(cs[t]>cs[e])e=t;
 const fs=[];for(let t=e;t>=0;t=bk[t])fs.push(t);fs.reverse();
 let B=fs.map(f=>(f+.5)/fr);
 if(B.length<8){B=[];for(let k=0;k*60/bpm<a.dur;k++)B.push(.2+k*60/bpm)}
 {const er=[];B.forEach(t=>{const f=Math.round(t*fr);let bf=f,bv=-1;for(let j=-3;j<=3;j++){const v=tot[f+j]||0;if(v>bv){bv=v;bf=f+j}}if(bv>0)er.push(bf-f)});
  if(er.length>8){er.sort((p,q)=>p-q);const md=er[er.length>>1]/fr;if(Math.abs(md)>.004)B=B.map(t=>t+md)}}
 const sb=B.map(t=>{const f=Math.round(t*fr);let s=0;for(let j=-2;j<=2;j++)s+=1.2*(fl[0][f+j]||0)+.4*(fl[1][f+j]||0);return s});
 const mean=sb.reduce((p,q)=>p+q,0)/sb.length||1;let bm=4,bar=0,bc=0;
 for(const mm of[4,3])for(let ph=0;ph<mm;ph++){let s=0,k=0;for(let i=ph;i<sb.length;i+=mm){s+=sb[i];k++}const c=(s/(k||1))/mean*(mm===4?1.08:1);if(c>bc){bc=c;bm=mm;bar=ph}}
 return{B,bar,bm};
}
/* ---------- Уровень: сетка долей + сегменты сложности + длинные ноты ---------- */
const SEG=[1.22,1.08,.96,.86];
function segOf(t){const t0=A.B[0],r=(t-t0)/Math.max(1,A.dur-t0);return Math.max(0,Math.min(3,Math.floor(r*4)))}
function gen(d){
 const{fl,tot,fr,B,bar,bm,dur,es,m1,gm1}=A,N=cfg.lanes,div={easy:2,normal:2,hard:4}[d],F=tot.length,g=[];
 for(let i=0;i<B.length-1;i++){const t0=B[i],t1=B[i+1],pos=((i-bar)%bm+bm)%bm;
  for(let k=0;k<div;k++){
   const tg=t0+(t1-t0)*k/div;
   const w=k===0?(pos===0?1:(bm===4&&pos===2)?.8:.6):(div===2||k===2?.45:.3);
   const fc=Math.round(tg*fr),r=Math.max(1,Math.round(Math.min(.045,(t1-t0)/div/2.2)*fr));
   let s=0,pf=fc;for(let f=Math.max(2,fc-r);f<=Math.min(F-3,fc+r);f++)if(tot[f]>s){s=tot[f];pf=f}
   g.push({tg,w,s,pf,pos,k})}}
 const ss=g.map(e=>e.s).sort((p,q)=>p-q),q=ss[Math.floor(ss.length*{easy:.88,normal:.72,hard:.55}[d])]||1;
 const gap={easy:.34,normal:.2,hard:.11}[d],pr=N===4?[[0,1],[1,2],[2,3]]:[[0,1],[1],[2,1]],alt=[0,0,0],hist=[],out=[];
 const bn=(b,f)=>Math.max(fl[b][f-1]||0,fl[b][f]||0,fl[b][f+1]||0);
 const pick=b=>{const p=pr[b];let l=p[alt[b]++%p.length];const h=hist.length;
  if(h>1&&hist[h-1]===l&&hist[h-2]===l)l=l===0?1:l===N-1?N-2:l+(alt[b]%2?1:-1);hist.push(l);return l};
 for(const e of g){
  const ef=Math.max(.55,Math.min(1.5,es[e.pf]||1));
  if(e.s<q*(1.5-e.w)*SEG[segOf(e.tg)]/Math.pow(ef,.9)||e.tg<.6||e.tg>dur-.4)continue;
  const t=(e.pf+.5)/fr,last=out[out.length-1];
  if(last&&t-last.t<gap){if(e.w>last.w&&(!out[out.length-2]||t-out[out.length-2].t>=gap))out.pop();else continue}
  const b=[bn(0,e.pf),bn(1,e.pf)*.9,bn(2,e.pf)*1.1],dom=b.indexOf(Math.max(...b));
  const n1={t,l:pick(dom),done:0,w:e.w,s:e.s};out.push(n1);
  if((d==='hard'||(d==='normal'&&e.pos===0&&e.k===0))&&b[0]>2.5&&b[2]>2.5&&dom!==2){
   let l2=pick(2);if(l2===n1.l)l2=l2===N-1?N-2:l2+1;out.push({t,l:l2,done:0,w:e.w})}}
 // длинные ноты: участки, где ровно звучит мид-полоса (вокал/лид); короткие разрывы и слабые удары допускаются
 const hd={easy:.9,normal:.7,hard:.55}[d],sus=new Uint8Array(F);
 {const ms=m1.slice().sort((p,q)=>p-q),med=ms[F>>1]||0,p90=ms[Math.floor(F*.9)]||0,thr=Math.max(.45,med*1.5,p90*.35);
  for(let f=0;f<F;f++)if(m1[f]>=thr)sus[f]=1;
